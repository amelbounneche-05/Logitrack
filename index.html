<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogiTrack — Dashboard</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar with clickable brand logo -->
    <aside class="sidebar">
      <div id="home-logo" class="logo-container" style="cursor: pointer;">
        <img src="./assets/logo_logitrack.png" alt="LogiTrack" style="width: 100%; max-height: 60px; object-fit: contain;">
      </div>
      
      <nav class="nav-menu">
        <button type="button" class="nav-btn" data-view="dashboard">Dashboard</button>
        <button type="button" class="nav-btn active" data-view="shipments">Shipments</button>
      </nav>
      <button type="button" id="reset-data-btn" class="btn-reset">Reset Data</button>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <input type="search" id="search-input" placeholder="Search by tracking number or recipient...">
      </header>

      <main id="app-content">
        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view-section" style="display: none;">
          <h2>Dashboard</h2>
          
          <div class="kpi-container">
            <div class="kpi-card kpi-transit">
              <span class="kpi-title">IN TRANSIT</span>
              <span class="kpi-number" id="count-transit">48</span>
              <span class="kpi-sub">Key metric</span>
            </div>
            <div class="kpi-card kpi-delivered">
              <span class="kpi-title">DELIVERED</span>
              <span class="kpi-number" id="count-delivered">156</span>
              <span class="kpi-sub">Key metric</span>
            </div>
            <div class="kpi-card kpi-delayed">
              <span class="kpi-title">DELAYED</span>
              <span class="kpi-number" id="count-delayed">7</span>
              <span class="kpi-sub">Key metric</span>
            </div>
            <div class="kpi-card kpi-pending">
              <span class="kpi-title">PENDING</span>
              <span class="kpi-number" id="count-pending">21</span>
              <span class="kpi-sub">Key metric</span>
            </div>
          </div>

          <div class="filters-bar">
            <select id="filter-carrier-dash">
              <option value="ALL">Carrier: All</option>
              <option value="DHL">DHL</option>
              <option value="Chronopost">Chronopost</option>
              <option value="Colissimo">Colissimo</option>
            </select>
            <select id="filter-status-dash">
              <option value="ALL">Status: All</option>
              <option value="IN_TRANSIT">In Transit</option>
              <option value="DELIVERED">Delivered</option>
              <option value="DELAYED">Delayed</option>
              <option value="PENDING">Pending</option>
            </select>
          </div>

          <div id="shipments-container" class="shipments-grid"></div>
        </section>

        <!-- SHIPMENTS VIEW -->
        <section id="view-shipments" class="view-section" style="display: block;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Shipments</h2>
          </div>
          
          <div class="filters-bar" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 15px;">
              <select id="filter-carrier-table">
                <option value="ALL">Carrier: All</option>
                <option value="DHL">DHL</option>
                <option value="Chronopost">Chronopost</option>
                <option value="Colissimo">Colissimo</option>
              </select>
              <select id="filter-status-table">
                <option value="ALL">Status: All</option>
                <option value="IN_TRANSIT">In Transit</option>
                <option value="DELIVERED">Delivered</option>
                <option value="DELAYED">Delayed</option>
                <option value="PENDING">Pending</option>
              </select>
            </div>
            <button id="new-shipment-btn" style="background: #e1bee7; border: 2px solid #000; border-radius: 8px; padding: 8px 15px; font-weight: bold; cursor: pointer;">+ New Shipment</button>
          </div>

          <table class="shipments-table">
            <thead>
              <tr>
                <th>Tracking #</th>
                <th>Carrier & Recipient</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="shipments-table-body"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <dialog id="shipment-modal"></dialog>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
