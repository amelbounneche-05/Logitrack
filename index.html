<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogiTrack — Tableau de bord</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="app-layout">
    <!-- Barre latérale avec logo cliquable -->
    <aside class="sidebar">
      <div id="home-logo" class="logo-container" style="cursor: pointer; text-align: center; margin-bottom: 20px;">
        <img src="./assets/logo_logitrack.png" alt="LogiTrack" style="width: 100%; max-height: 60px; object-fit: contain;">
      </div>
      
      <nav class="nav-menu">
        <button type="button" class="nav-btn active" data-view="dashboard">Tableau de bord</button>
        <button type="button" class="nav-btn" data-view="shipments">Expéditions</button>
      </nav>
      <button type="button" id="reset-data-btn" class="btn-reset">Réinitialiser les données</button>
    </aside>

    <!-- Contenu principal -->
    <div class="main-wrapper">
      <header class="topbar">
        <input type="search" id="search-input" placeholder="Rechercher un n° de suivi ou un destinataire...">
      </header>

      <main id="app-content">
        <!-- VUE TABLEAU DE BORD -->
        <section id="view-dashboard" class="view-section active">
          <h2>Tableau de bord</h2>
          
          <div class="kpi-container">
            <div class="kpi-card kpi-transit">
              <span class="kpi-title">EN TRANSIT</span>
              <span class="kpi-number" id="count-transit">48</span>
              <span class="kpi-sub">Chiffre clé</span>
            </div>
            <div class="kpi-card kpi-delivered">
              <span class="kpi-title">LIVRÉ</span>
              <span class="kpi-number" id="count-delivered">156</span>
              <span class="kpi-sub">Chiffre clé</span>
            </div>
            <div class="kpi-card kpi-delayed">
              <span class="kpi-title">RETARD</span>
              <span class="kpi-number" id="count-delayed">7</span>
              <span class="kpi-sub">Chiffre clé</span>
            </div>
            <div class="kpi-card kpi-pending">
              <span class="kpi-title">EN ATTENTE</span>
              <span class="kpi-number" id="count-pending">21</span>
              <span class="kpi-sub">Chiffre clé</span>
            </div>
          </div>

          <div class="filters-bar">
            <select id="filter-carrier-dash">
              <option value="ALL">Transporteur : Tous</option>
              <option value="DHL">DHL</option>
              <option value="Chronopost">Chronopost</option>
              <option value="Colissimo">Colissimo</option>
            </select>
            <select id="filter-status-dash">
              <option value="ALL">Statut : Tous</option>
              <option value="IN_TRANSIT">En transit</option>
              <option value="DELIVERED">Livré</option>
              <option value="DELAYED">Retard</option>
              <option value="PENDING">En attente</option>
            </select>
          </div>

          <div id="shipments-container" class="shipments-grid"></div>
        </section>

        <!-- VUE EXPEDITIONS (Tableau) -->
        <section id="view-shipments" class="view-section" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Expéditions</h2>
          </div>
          
          <table class="shipments-table">
            <thead>
              <tr>
                <th>N°</th>
                <th>Transporteurs</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="shipments-table-body"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <dialog id="shipment-modal"></dialog>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
