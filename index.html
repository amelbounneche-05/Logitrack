<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogiTrack — Dashboard</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="light-theme">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div id="home-logo" class="logo-container" style="cursor: pointer;">
        <img src="./assets/logo_logitrack.png" alt="LogiTrack">
        <span class="sidebar-badge">Logistics Hub</span>
      </div>
      
      <nav class="nav-menu">
        <button type="button" class="nav-btn" data-view="dashboard">Tableau de bord</button>
        <button type="button" class="nav-btn active" data-view="shipments">Expéditions</button>
      </nav>

      <div class="sidebar-footer">
        <!-- Theme Toggle Button -->
        <button type="button" id="theme-toggle-btn" class="btn-theme" style="margin-bottom: 10px;">🌙 Mode Sombre</button>
        <button type="button" id="reset-data-btn" class="btn-reset">Réinitialiser les données</button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <input type="search" id="search-input" placeholder="Rechercher un n° de suivi ou un destinataire...">
      </header>

      <main id="app-content">
        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view-section" style="display: none;">
          <h2>Tableau de bord</h2>
          
          <div class="kpi-container">
            <div class="kpi-card kpi-transit">
              <span class="kpi-title">EN TRANSIT</span>
              <span class="kpi-number" id="count-transit">48</span>
            </div>
            <div class="kpi-card kpi-delivered">
              <span class="kpi-title">LIVRÉ</span>
              <span class="kpi-number" id="count-delivered">156</span>
            </div>
            <div class="kpi-card kpi-delayed">
              <span class="kpi-title">RETARD</span>
              <span class="kpi-number" id="count-delayed">7</span>
            </div>
            <div class="kpi-card kpi-pending">
              <span class="kpi-title">EN ATTENTE</span>
              <span class="kpi-number" id="count-pending">21</span>
            </div>
          </div>

          <div class="filters-bar">
            <select id="filter-carrier-dash">
              <option value="ALL">Transport: Tous</option>
              <option value="DHL">DHL</option>
              <option value="Chronopost">Chronopost</option>
              <option value="Colissimo">Colissimo</option>
            </select>
            <select id="filter-status-dash">
              <option value="ALL">Statut: Tous</option>
              <option value="IN_TRANSIT">En transit</option>
              <option value="DELIVERED">Livré</option>
              <option value="DELAYED">Retard</option>
              <option value="PENDING">En attente</option>
            </select>
          </div>

          <div id="shipments-container" class="shipments-grid"></div>
        </section>

        <!-- SHIPMENTS VIEW -->
        <section id="view-shipments" class="view-section" style="display: block;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Expéditions</h2>
          </div>
          
          <div class="filters-bar" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 15px;">
              <select id="filter-carrier-table">
                <option value="ALL">Transport: Tous</option>
                <option value="DHL">DHL</option>
                <option value="Chronopost">Chronopost</option>
                <option value="Colissimo">Colissimo</option>
              </select>
              <select id="filter-status-table">
                <option value="ALL">Statut: Tous</option>
                <option value="IN_TRANSIT">En transit</option>
                <option value="DELIVERED">Livré</option>
                <option value="DELAYED">Retard</option>
                <option value="PENDING">En attente</option>
              </select>
            </div>
            <button id="new-shipment-btn" class="btn-new">+ Nouvelle expédition</button>
          </div>

          <table class="shipments-table">
            <thead>
              <tr>
                <th>N°</th>
                <th>Transporteurs</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="shipments-table-body"></tbody>
          </table>
        </section>

        <!-- DETAILS PAGE VIEW -->
        <section id="view-details" class="view-section" style="display: none;">
          <div style="margin-bottom: 15px;">
            <button id="details-back-btn" class="btn-back">← Retour</button>
          </div>
          <h2 id="details-title" style="margin-bottom: 25px;">Détails expédition</h2>
          
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 35px; max-width: 650px;">
            <div style="text-align: center;">
              <div id="t-step-1" class="timeline-dot active"></div>
              <span style="font-size: 14px; font-weight: bold;">Commande reçue</span>
            </div>
            <div style="text-align: center;">
              <div id="t-step-2" class="timeline-dot"></div>
              <span style="font-size: 14px; font-weight: bold;">En transit</span>
            </div>
            <div style="text-align: center;">
              <div id="t-step-3" class="timeline-dot"></div>
              <span style="font-size: 14px; font-weight: bold;">En livraison</span>
            </div>
            <div style="text-align: center;">
              <div id="t-step-4" class="timeline-dot"></div>
              <span style="font-size: 14px; font-weight: bold;">Livré</span>
            </div>
          </div>

          <div class="details-box">
            <p id="details-recipient" style="font-size: 16px; margin-bottom: 12px; font-weight: bold;"></p>
            <p id="details-carrier" style="font-size: 16px; margin-bottom: 12px;"></p>
            <p id="details-priority" style="font-size: 16px; margin-bottom: 12px;"></p>
            <p id="details-date" style="font-size: 16px;"></p>
          </div>

          <div style="display: flex; gap: 15px;">
            <button id="page-edit-btn" class="btn-page-edit">Modifier</button>
            <button id="page-delete-btn" class="btn-page-delete">Supprimer</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="shipment-modal"></dialog>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
